name: Terraform plan comment
description: >
  terraform show の結果を PR に1件のコメントとして出す（同じ marker のコメントがあれば更新する）。
inputs:
  plan-file:
    description: terraform show -no-color の出力を書いたファイル
    required: true
  marker:
    description: コメントを見分ける印（構成ごとに変える）
    default: terraform-plan
  title:
    description: コメントの見出し
    default: terraform plan（本番）
runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      env:
        PLAN_FILE: ${{ inputs.plan-file }}
        MARKER: ${{ inputs.marker }}
        TITLE: ${{ inputs.title }}
      with:
        script: |
          const fs = require("fs");
          const { PLAN_FILE, MARKER, TITLE } = process.env;
          const plan = fs.readFileSync(PLAN_FILE, "utf8");
          const summary =
            plan.match(/^Plan: .*$/m)?.[0] ??
            (plan.includes("No changes.") ? "No changes." : "（要約が見つからない）");
          const limit = 60000;
          const marker = `<!-- ${MARKER} -->`;
          const body = [
            marker,
            `### ${TITLE}: ${summary}`,
            "<details><summary>差分</summary>",
            "",
            "```",
            plan.length > limit ? plan.slice(0, limit) + "\n…（長いので省略）" : plan,
            "```",
            "</details>",
          ].join("\n");
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
          });
          const previous = comments.find((c) => c.body?.startsWith(marker));
          if (previous) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
