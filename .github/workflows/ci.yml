name: CI

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.prettierrc'
              - '.prettierignore'
              - '.nvmrc'
            infra:
              - 'infra/**'

  # apps/* と packages/* はワークスペースでつながっているので、まとめて検査する
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform validate
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # 必須ステータスチェックはこの ci ジョブ1つだけを指定する。
  #
  # app / infra は変更検出で skip されることがあり、skipped は success にならない。
  # それらを直接必須チェックに指定すると、該当ディレクトリを触っていない PR が
  # 永久にマージできなくなる。ここで結果を集約し、「失敗・キャンセルが1つもないこと」を成功条件にする。
  ci:
    needs: [changes, app, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::CI failed (job result: $r)"; exit 1 ;;
            esac
          done
          echo "all jobs passed or were skipped"
