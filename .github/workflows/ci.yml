name: CI

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.prettierrc'
              - '.prettierignore'
              - '.nvmrc'
            infra:
              - 'infra/**'

  # apps/* と packages/* はワークスペースでつながっているので、まとめて検査する
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform validate
        run: |
          # infra/bootstrap はテンプレート（yu-kod/app-template）にだけある
          for dir in infra infra/bootstrap; do
            [ -d "$dir" ] || continue
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # infra を変えた PR に、本番に対する terraform plan の差分をコメントする。
  # 読み取り専用の plan ロールを使う（PR のジョブからだけ引き受けられる。infra/bootstrap）。
  # テンプレート自身（デプロイしない）、Dependabot とフォークの PR（OIDC トークンが出ない）は飛ばす。
  plan:
    needs: changes
    if: >-
      needs.changes.outputs.infra == 'true' &&
      !github.event.repository.is_template &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        id: aws
        uses: ./.github/actions/aws-login
        with:
          role: plan
          role-arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          required: "false"

      - uses: actions/setup-node@v7
        if: steps.aws.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      # archive_file が apps/api/dist を固めるので、plan の前にビルドする
      - name: Build Lambda
        if: steps.aws.outputs.configured == 'true'
        run: npm ci && npm run build:lambda

      - uses: hashicorp/setup-terraform@v4
        if: steps.aws.outputs.configured == 'true'
        with:
          terraform_wrapper: false

      - name: Terraform init
        if: steps.aws.outputs.configured == 'true'
        uses: ./.github/actions/terraform-init

      # 読み取り専用のロールなのでロックは取らない（-lock=false）
      - name: Terraform plan
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: |
          terraform plan -input=false -lock=false -no-color \
            -var "project_name=${PROJECT_NAME}" -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: steps.aws.outputs.configured == 'true'
        uses: ./.github/actions/terraform-plan-comment
        with:
          plan-file: infra/plan.txt

  # 必須ステータスチェックはこの ci ジョブ1つだけを指定する。
  #
  # app / infra は変更検出で skip されることがあり、skipped は success にならない。
  # それらを直接必須チェックに指定すると、該当ディレクトリを触っていない PR が
  # 永久にマージできなくなる。ここで結果を集約し、「失敗・キャンセルが1つもないこと」を成功条件にする。
  ci:
    needs: [changes, app, infra, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::CI failed (job result: $r)"; exit 1 ;;
            esac
          done
          echo "all jobs passed or were skipped"
