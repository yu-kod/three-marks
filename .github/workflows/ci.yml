name: CI

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.prettierrc'
              - '.prettierignore'
              - '.nvmrc'
            infra:
              - 'infra/**'

  # apps/* と packages/* はワークスペースでつながっているので、まとめて検査する
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform validate
        run: |
          # infra/bootstrap はテンプレート（yu-kod/app-template）にだけある
          for dir in infra infra/bootstrap; do
            [ -d "$dir" ] || continue
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # infra を変えた PR に、本番に対する terraform plan の差分をコメントする。
  # 読み取り専用の plan ロールを使う（PR のジョブからだけ引き受けられる。infra/bootstrap）。
  # ロールが未登録（テンプレート自身、AWS の準備前、Secrets を読めない Dependabot の PR）なら飛ばす。
  plan:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$AWS_PLAN_ROLE_ARN" ]; then
            echo "::notice::AWS_PLAN_ROLE_ARN が無いので terraform plan を飛ばす（docs/deploy.md）"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.setup.outputs.enabled == 'true'

      - uses: actions/setup-node@v7
        if: steps.setup.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      # archive_file が apps/api/dist を固めるので、plan の前にビルドする
      - name: Build Lambda
        if: steps.setup.outputs.enabled == 'true'
        run: npm ci && npm run build:lambda

      - uses: hashicorp/setup-terraform@v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.setup.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Terraform init
        if: steps.setup.outputs.enabled == 'true'
        uses: ./.github/actions/terraform-init

      # 読み取り専用のロールなのでロックは取らない（-lock=false）
      - name: Terraform plan
        if: steps.setup.outputs.enabled == 'true'
        working-directory: infra
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: |
          terraform plan -input=false -lock=false -no-color \
            -var "project_name=${PROJECT_NAME}" -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: steps.setup.outputs.enabled == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const plan = fs.readFileSync("infra/plan.txt", "utf8");
            const summary =
              plan.match(/^Plan: .*$/m)?.[0] ??
              (plan.includes("No changes.") ? "No changes." : "（要約が見つからない）");
            const limit = 60000;
            const body = [
              "<!-- terraform-plan -->",
              `### terraform plan（本番）: ${summary}`,
              "<details><summary>差分</summary>",
              "",
              "```",
              plan.length > limit ? plan.slice(0, limit) + "\n…（長いので省略）" : plan,
              "```",
              "</details>",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const previous = comments.find((c) => c.body?.startsWith("<!-- terraform-plan -->"));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # 必須ステータスチェックはこの ci ジョブ1つだけを指定する。
  #
  # app / infra は変更検出で skip されることがあり、skipped は success にならない。
  # それらを直接必須チェックに指定すると、該当ディレクトリを触っていない PR が
  # 永久にマージできなくなる。ここで結果を集約し、「失敗・キャンセルが1つもないこと」を成功条件にする。
  ci:
    needs: [changes, app, infra, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::CI failed (job result: $r)"; exit 1 ;;
            esac
          done
          echo "all jobs passed or were skipped"
