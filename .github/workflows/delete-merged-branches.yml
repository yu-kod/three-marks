name: Delete merged branches

# マージ済みのブランチを消す。Actions の画面から手で実行する（Run workflow）。
# ふだんはリポジトリの設定「Automatically delete head branches」でマージのたびに消える。
# これは設定がオフだった間に残ったものを片付けるためのもの。
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: main にマージ済みで、開いている PR が無いブランチを消す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --limit 200 --json headRefName --jq '.[].headRefName')
          git branch -r --merged origin/main --format='%(refname:lstrip=3)' \
            | grep -vx -e main -e HEAD \
            | while read -r branch; do
                if grep -qxF "$branch" <<<"$open"; then
                  echo "残す（PR が開いている）: $branch"
                  continue
                fi
                git push origin --delete "$branch"
                echo "- $branch" >> "$GITHUB_STEP_SUMMARY"
              done
